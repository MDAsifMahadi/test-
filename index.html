<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PeerJS Tic Tac Toe</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f9f9f9;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #my-id, #status {
      font-weight: bold;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      max-width: 300px;
      margin: 20px auto;
    }

    .cell {
      background: white;
      border: 1px solid #ccc;
      height: 100px;
      font-size: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .connection-box {
      max-width: 400px;
      margin: auto;
      padding: 10px;
    }

    input {
      padding: 8px;
      width: 80%;
      max-width: 300px;
      margin-bottom: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      padding: 8px 16px;
      border: none;
      background: #007BFF;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    @media (max-width: 500px) {
      .cell {
        height: 80px;
        font-size: 2em;
      }

      .board {
        max-width: 90vw;
      }

      input {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1>PeerJS Tic Tac Toe</h1>

  <div class="connection-box">
    <p>Your ID: <span id="my-id">...</span></p>
    <input type="text" id="peer-id" placeholder="Enter other player's ID" />
    <br>
    <button id="connect">Connect</button>
    <p id="status">Not connected</p>
  </div>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <script>
    const peer = new Peer();

    let conn = null;
    let currentPlayer = 'X';
    let isMyTurn = false;

    peer.on('open', (id) => {
      document.getElementById('my-id').textContent = id; // Display the ID when the peer is ready
    });

    document.getElementById('connect').onclick = () => {
      const otherID = document.getElementById('peer-id').value.trim();
      if (otherID) {
        conn = peer.connect(otherID);
        setupConnection(false);
      }
    };

    peer.on('connection', (incoming) => {
      conn = incoming;
      setupConnection(true);
    });

    function setupConnection(iAmHost) {
      conn.on('open', () => {
        document.getElementById('status').textContent = "Connected!";
        isMyTurn = iAmHost;
      });

      conn.on('data', (data) => {
        const cell = document.querySelector(`.cell[data-index="${data.index}"]`);
        if (!cell.textContent) {
          cell.textContent = data.symbol;
          isMyTurn = true;
        }
      });
    }

    document.querySelectorAll('.cell').forEach(cell => {
      cell.onclick = () => {
        const index = cell.dataset.index;
        if (!cell.textContent && isMyTurn && conn?.open) {
          cell.textContent = currentPlayer;
          conn.send({ index, symbol: currentPlayer });
          isMyTurn = false;
        }
      };
    });
  </script>
</body>
</html>
